[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archmath"
version = "0.1.0"
description = "Mathematical Decoding, First-Principles Implementations, and Real-Time Hidden-Space Manifold Tracing for Modern AI Architectures"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "sympy>=1.12",
    "scipy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["archmath*"]

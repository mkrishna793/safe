name: ArchMath Verification Battery

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Architecture Integration Battery (17/17)
        run: |
          python -m archmath.tests.test_archs

      - name: Run RealTimeMathDecoder Invariants & Red-Team Battery
        run: |
          python -m archmath.tests.test_math_framework

      - name: Run Advanced Frontier Mathematics Battery (EK-FAC, Sheaf, DLA, Torus)
        run: |
          python -m archmath.tests.test_advanced_math
